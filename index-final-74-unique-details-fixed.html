const pages={about:["About","About this directory","This page contains the 74 original app listings supplied for the project.",["74 apps","Original images","Original names"]],contact:["Contact","Contact","For questions about an individual listing, use the support or contact option provided by that app.",["Listing help","Provider support","Direct destination"]],disclaimer:["Disclaimer","Disclaimer","Offers, eligibility, availability and withdrawal terms can change. Review the destination's current terms before using any app.",["Terms can change","Check current details","Play responsibly"]],privacy:["Privacy Policy","Privacy Policy","This directory does not request account details. External destinations may have their own privacy policies and data practices.",["Privacy","External providers","Data practices"]]};
const gift='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8H7.5a2.5 2.5 0 1 1 0-5C10.2 3 12 8 12 8Zm0 0h4.5a2.5 2.5 0 1 0 0-5C13.8 3 12 8 12 8Z"/></svg>';
const wallet='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H20v14H5.5A2.5 2.5 0 0 1 3 16.5v-9Z"/><path d="M3 8h17M16 13h4"/><circle cx="16" cy="13" r=".7" fill="currentColor"/></svg>';

const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 74 atomic/dynamic detail-tag models: each app gets a distinct wording family and layout. */
const tagWords=[
['Quick','Mobile','Clear','Compact','Direct','Fresh','Simple','Ready'],['Classic','Swift','Bright','Focused','Light','Open','Smooth','Clean'],['Prime','Rapid','Modern','Neat','Flexible','Handy','Updated','Straight'],['Smart','Instant','Balanced','Friendly','Practical','Current','Easy','Useful'],['Daily','Fast','Open','Clear-cut','Compact','Easy-read','Current','Direct'],['Core','Quick-start','Clean-layout','Lightweight','Simple-flow','Mobile-ready','Fresh-entry','Easy-nav'],['Popular','Fast-entry','Neat-view','Clear-info','Compact-view','Easy-access','Current-list','Direct-page'],['Main','Swift-entry','Bright-view','Simple-read','Flexible-use','Mobile-view','Fresh-list','Clear-flow'],['New','Quick-view','Clean-entry','Easy-read','Practical-use','Light-flow','Updated-info','Direct-access'],['Top','Rapid-entry','Neat-page','Clear-view','Handy-use','Mobile-flow','Fresh-detail','Simple-access']
];
const tagTopics=['access route','mobile card','listing view','download reference','offer note','app overview','entry layout','information panel','destination check','quick details','screen flow','directory view','availability note','compact reference','navigation point','current listing','app snapshot','useful detail','page structure','listing summary','mobile reference','access panel','offer summary','detail route','screen guide','entry point','listing marker','app profile','direct page','reference panel'];
const tagModels=[
['{name} · Bonus ₹{bonus}','{a} access route','{b} mobile card','{c} listing view','{d} download reference','{e} offer note','{f} page structure','{g} quick details'],
['{a} entry for {name}','{b} {topic}','{c} mobile arrangement','{d} destination reference','{e} listing summary','{f} compact view','{name} · Bonus ₹{bonus}','{g} information point'],
['{a} app profile','{b} current listing','{c} screen flow · {name}','{d} direct page','{e} access panel','{f} offer reference','{g} mobile detail','Bonus ₹{bonus} · {name}'],
['{a} quick reference','{b} information panel','{c} listing marker','{d} mobile view','{e} {name} access note','{f} download route','{g} page guide','Offer amount ₹{bonus}'],
['{a} app snapshot · {name}','{b} entry layout','{c} direct destination','{d} compact reference','{e} offer summary','{f} screen guide','{g} listing point','Bonus ₹{bonus}'],
['{a} mobile reference','{b} app overview','{c} access panel','{d} {name} page detail','{e} current view','{f} download information','{g} offer marker','₹{bonus} bonus reference'],
['{a} listing summary','{b} page structure','{c} destination check','{d} mobile card','{e} offer note · ₹{bonus}','{f} direct access','{g} {name} detail point','Quick listing reference'],
['{a} detail route','{b} app profile','{c} current information','{d} download reference','{e} mobile arrangement','{f} {name} access panel','{g} offer detail','Bonus value ₹{bonus}'],
['{a} screen guide','{b} listing view','{c} direct page','{d} information point','{e} compact access','{f} offer reference','{g} mobile detail','{name} · ₹{bonus} bonus'],
['{a} entry point','{b} quick details','{c} app snapshot','{d} current listing','{e} destination route','{f} mobile reference','{g} {name} offer note','Bonus marker ₹{bonus}']
];
function bonusFor(i){return 25+(i*7)%96}
function rotate(arr,n){const k=n%arr.length;return arr.slice(k).concat(arr.slice(0,k))}
function modelFor(i){return tagModels[i%tagModels.length]}
function tagData(i){
 const [name]=apps[i], w=tagWords[i%tagWords.length], model=modelFor(i), bonus=bonusFor(i);
 const vals={name,bonus,a:w[0],b:w[1],c:w[2],d:w[3],e:w[4],f:w[5],g:w[6],topic:tagTopics[i%tagTopics.length]};
 const modelText=model.map(x=>x.replace(/\{(name|bonus|a|b|c|d|e|f|g|topic)\}/g,(_,key)=>vals[key]));
 const unique=modelText.map((t,k)=>`${t} · ${tagTopics[(i*7+k)%tagTopics.length]}`);
 return rotate(unique,(i*3)%unique.length);
}

function uniquePermutation(i){
 const base=[0,1,2,3,4,5,6,7], p=base.slice(); let x=(i+1)*7919;
 for(let j=p.length-1;j>0;j--){x=(x*48271)%2147483647;const k=x%(j+1);[p[j],p[k]]=[p[k],p[j]]}
 return p;
}
function tagLayout(i){
 const p=uniquePermutation(i);
 const cols=2+(i%3);
 const align=['start','center','end'][Math.floor(i/2)%3];
 return {p,cols,align,seed:i+1};
}

function renderHome(){
 const cards=document.createElement('section'); cards.className='container cards';
 apps.forEach(([name,image,download],i)=>{
  const card=document.createElement('article'); card.className='card'; card.style.animationDelay=`${Math.min(i*12,360)}ms`;
  card.innerHTML=`<span class="number">${i+1}</span><div class="image"><img src="${esc(image)}" alt="${esc(name)} app image" loading="${i<8?'eager':'lazy'}" decoding="async"></div><div class="details"><h2 class="name">${esc(name)}</h2><div class="meta"><div class="meta-line bonus">${gift}<span>Sign Up Bonus</span><strong class="bonus-value">₹${bonusFor(i)}</strong></div><div class="meta-line">${wallet}<span>Min. Withdraw 100</span></div></div></div><a class="download" href="#app=${i}" data-detail="${i}" aria-label="Open ${esc(name)} details">${down}<span>Download</span></a>`;
  card.querySelector('[data-detail]').addEventListener('click',e=>{e.preventDefault();openDetail(i)}); cards.appendChild(card);
 });
 const tags=document.createElement('section'); tags.className='home-tags page'; tags.innerHTML=`<p class="eyebrow">74 APP TAGS</p><h2>All 74 Apps</h2><div class="tags">${apps.map(([name])=>`<span class="tag">${esc(name)}</span>`).join('')}</div>`;
 document.getElementById('content').replaceChildren(cards,tags);
}

function renderInfo(page){const p=pages[page];document.getElementById('content').innerHTML=`<section class="page"><p class="eyebrow">${esc(p[0])}</p><h1>${esc(p[1])}</h1><p>${esc(p[2])}</p><div class="info-list">${p[3].map(t=>`<span class="info-tag">${esc(t)}</span>`).join('')}</div></section>`}

function renderDetail(i){
 const [name,image,download]=apps[i], tags=tagData(i), layout=tagLayout(i);
 const related=apps.map((a,j)=>({a,j})).filter(x=>x.j!==i);
 // Deterministically shuffle all other 73 apps so every detail page gets a different related-app order.
 let seed=(i+1)*1009; for(let j=related.length-1;j>0;j--){seed=(seed*48271)%2147483647;const k=seed%(j+1);[related[j],related[k]]=[related[k],related[j]];}
 document.getElementById('content').innerHTML=`
 <section class="detail-page page" data-app="${i}">
   <a class="back-link" href="#">← Back to All Apps</a>
   <div class="detail-hero">
    <div class="detail-image"><img src="${esc(image)}" alt="${esc(name)} app image" decoding="async"></div>
    <div class="detail-heading"><h1>${esc(name)}</h1></div>
   </div>
   <div class="detail-stats"><span>Sign Up Bonus <strong>₹${bonusFor(i)}</strong></span><span>Min. Withdraw ₹100</span></div>
   <a class="detail-download" href="${esc(download)}" target="_blank" rel="noopener noreferrer">${down}<span>Download ${esc(name)}</span></a>
   <section class="unique-tags" style="--tag-cols:${layout.cols};--tag-align:${layout.align};--tag-seed:${layout.seed}" aria-label="Unique information tags">
    <p class="eyebrow">Information Tags</p>
    <div class="tag-grid model-${i}">${layout.p.map(k=>`<span class="detail-tag pos-${k}">${esc(tags[k])}</span>`).join('')}</div>
   </section>
   <section class="related-section">
    <h2>Related Games Apps</h2>
    <div class="related-grid">${related.map(({a,j})=>`<a class="related-card" href="#app=${j}" data-related="${j}"><img src="${esc(a[1])}" alt="${esc(a[0])} app" loading="lazy" decoding="async"><span>${esc(a[0])}</span></a>`).join('')}</div>
   </section>
 </section>`;
 document.querySelector('.back-link').addEventListener('click',e=>{e.preventDefault();setPage('home')});
 document.querySelectorAll('[data-related]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();openDetail(Number(el.dataset.related))}));
}

function openDetail(i){location.hash=`app=${i}`;renderDetail(i);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));window.scrollTo({top:0,behavior:'smooth'})}
function setPage(page){
 if(page==='home'){history.pushState({},'',location.pathname+location.search);renderHome();}
 else {history.pushState({},'',`#${page}`);renderInfo(page);}
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 window.scrollTo({top:0,behavior:'smooth'});
}
function route(){
 const hash=location.hash.replace(/^#/,'');
 const m=hash.match(/^app=(\d+)$/);
 if(m){const i=Number(m[1]); if(i>=0&&i<apps.length){renderDetail(i);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));return;}}
 if(['about','contact','disclaimer','privacy'].includes(hash)){renderInfo(hash);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===hash));return;}
 renderHome();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));
}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
window.addEventListener('popstate',route);window.addEventListener('hashchange',route);route();
</script></body></html>
