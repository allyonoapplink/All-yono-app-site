function renderHome(){
 const cards=document.createElement("section");cards.className="container cards";
 apps.forEach(([name,image,download],i)=>{const card=document.createElement("article");card.className="card";card.id=`app-${i+1}`;card.style.animationDelay=`${Math.min(i*12,360)}ms`;card.innerHTML=`<span class="number">${i+1}</span><div class="image"><img src="${esc(image)}" alt="${esc(name)} app image" loading="${i<8?"eager":"lazy"}" decoding="async"></div><div class="details"><h2 class="name">${esc(name)}</h2><div class="meta"><div class="meta-line bonus">${gift}<span>Sign Up Bonus</span></div><div class="meta-line">${wallet}<span>Min. Withdraw 100</span></div></div></div><a class="download detail-open" href="#app-${i+1}" data-app-index="${i}">${down}<span>Download</span></a>`;cards.appendChild(card)});
 const tags=document.createElement("section");tags.className="home-tags page";tags.innerHTML=`<p class="eyebrow">74 APP TAGS</p><h2>All 74 Apps</h2><div class="tags">${apps.map(([name])=>`<span class="tag">${esc(name)}</span>`).join("")}</div>`;document.getElementById("content").replaceChildren(cards,tags);bindDynamicLinks();
}
function renderInfo(page){const p=pages[page];document.getElementById("content").innerHTML=`<section class="page"><p class="eyebrow">${esc(p[0])}</p><h1>${esc(p[1])}</h1><p>${esc(p[2])}</p><div class="info-list">${p[3].map(t=>`<span class="info-tag">${esc(t)}</span>`).join("")}</div></section>`}
function setPage(page){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));page==="home"?renderHome():renderInfo(page);window.scrollTo({top:0,behavior:"smooth"})}
function bindDynamicLinks(){
 document.querySelectorAll("[data-app-index]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();const i=Number(el.dataset.appIndex);renderDetail(i);history.pushState({appIndex:i},"",`#app-${i+1}`);}));
 document.querySelectorAll("[data-home-link]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();history.pushState({page:"home"},"","#home");setPage("home");}));
}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{history.pushState({page:b.dataset.page},"",`#${b.dataset.page}`);setPage(b.dataset.page)}));
window.addEventListener("popstate",()=>{const m=location.hash.match(/^#app-(\d+)$/);if(m)renderDetail(Math.max(0,Math.min(73,Number(m[1])-1)));else setPage(["about","contact","disclaimer","privacy"].includes(location.hash.slice(1))?location.hash.slice(1):"home");});
(function init(){const m=location.hash.match(/^#app-(\d+)$/);if(m)renderDetail(Math.max(0,Math.min(73,Number(m[1])-1)));else renderHome();})();
</script></body></html>
