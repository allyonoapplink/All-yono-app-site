    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap");

      :root {
        --paper: #f5f1e8;
        --ink: #202b2b;
        --muted: #687a72;
        --border: #deded6;
        --red: #b4312d;
        --green: #197957;
        --soft-green: #e7eee8;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(
            circle at 5% 0%,
            rgba(25, 121, 87, 0.08),
            transparent 22rem
          ),
          radial-gradient(
            circle at 96% 22%,
            rgba(180, 49, 45, 0.08),
            transparent 20rem
          ),
          var(--paper);
        color: var(--ink);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
      }
      .shell {
        min-height: 100vh;
        overflow-x: hidden;
      }
      .container {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
      }
      .mono {
        font-family: "DM Mono", monospace;
      }
      .display {
        font-family: "Space Grotesk", sans-serif;
      }
      .nav-wrap {
        padding: 16px 0 0;
      }
      .nav-strip {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid #dddcd4;
        border-radius: 16px;
        background: #eeeae1;
      }
      .nav-button {
        min-width: 0;
        min-height: 36px;
        padding: 8px 4px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #64716c;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .nav-button:hover,
      .nav-button.active {
        background: var(--ink);
        color: #fffaf1;
      }
      .nav-button:nth-child(1),
      .nav-button:nth-child(2),
      .nav-button:nth-child(3) {
        grid-column: span 2;
      }
      .nav-button:nth-child(4) {
        grid-column: 2 / span 2;
      }
      .nav-button:nth-child(5) {
        grid-column: 4 / span 2;
      }
      .nav-button:focus-visible,
      .download:focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 3px;
      }

      .cards-section {
        padding: 20px 0 64px;
      }
      .cards {
        display: grid;
        gap: 10px;
      }
      .card {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr) minmax(128px, 200px);
        align-items: center;
        gap: 16px;
        position: relative;
        min-width: 0;
        padding: 16px 16px 16px 20px;
        border: 1px solid #e3e3dc;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 5px 18px rgba(28, 40, 31, 0.055);
        animation: rise 0.45s both;
      }
      .number {
        position: absolute;
        top: 16px;
        left: -9px;
        z-index: 1;
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 30px;
        padding: 0 6px;
        border-radius: 999px;
        background: #c62d2e;
        color: #fff;
        font:
          700 11px "DM Mono",
          monospace;
        box-shadow: 0 3px 8px rgba(160, 34, 37, 0.22);
      }
      .image-wrap {
        width: 86px;
        height: 86px;
        overflow: hidden;
        border-radius: 17px;
        background: transparent;
      }
      .image-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }
      .details {
        min-width: 0;
      }
      .name {
        margin: 0;
        color: #171b1a;
        font:
          700 clamp(1rem, 2.2vw, 1.55rem) / 1.05 "Space Grotesk",
          sans-serif;
        letter-spacing: -0.045em;
        overflow-wrap: anywhere;
      }
      .meta {
        display: grid;
        gap: 5px;
        margin-top: 10px;
        color: #171b1a;
        font-size: clamp(0.72rem, 1.4vw, 0.98rem);
        font-weight: 700;
        line-height: 1.15;
      }
      .meta-line {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 7px;
      }
      .meta-line.bonus {
        color: #c62d2e;
      }
      .icon {
        width: 17px;
        height: 17px;
        flex: 0 0 17px;
      }
      .download {
        display: flex;
        min-height: 56px;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 14px;
        background: var(--green);
        color: #fff;
        font-size: clamp(0.78rem, 1.6vw, 1.2rem);
        font-weight: 800;
        text-decoration: none;
        box-shadow:
          inset 0 -2px 0 rgba(0, 0, 0, 0.35),
          0 5px 12px rgba(28, 40, 31, 0.16);
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }
      .download:hover {
        background: #126247;
        transform: translateY(-2px);
      }
      .download svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
      }

      .info-page {
        width: min(920px, calc(100% - 32px));
        margin: 32px auto 64px;
        padding: 40px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(28, 40, 31, 0.05);
      }
      .eyebrow {
        margin: 0;
        color: var(--red);
        font:
          500 10px/1.2 "DM Mono",
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .info-title {
        max-width: 680px;
        margin: 12px 0 0;
        color: var(--ink);
        font:
          700 clamp(1.65rem, 5vw, 3.1rem) / 0.98 "Space Grotesk",
          sans-serif;
        letter-spacing: -0.06em;
      }
      .info-copy {
        max-width: 680px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }
      .info-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 28px;
      }
      .info-tag {
        padding: 9px 12px;
        border-radius: 999px;
        background: var(--soft-green);
        color: #36504b;
        font-size: 12px;
        font-weight: 800;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (min-width: 640px) {
        .nav-wrap {
          padding-top: 24px;
        }
        .nav-strip {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
        .nav-button {
          grid-column: auto !important;
          min-height: 40px;
          padding: 10px 6px;
          font-size: 13px;
        }
        .cards-section {
          padding-top: 32px;
        }
      }
      @media (max-width: 639px) {
        .card {
          grid-template-columns: 76px minmax(0, 1fr) minmax(91px, 96px);
          gap: 10px;
          padding: 12px 10px 12px 15px;
          border-radius: 21px;
        }
        .image-wrap {
          width: 76px;
          height: 76px;
          border-radius: 15px;
        }
        .name {
          font-size: 0.98rem;
        }
        .meta {
          gap: 4px;
          margin-top: 8px;
          font-size: 0.68rem;
        }
        .meta-line {
          gap: 5px;
        }
        .icon {
          width: 14px;
          height: 14px;
          flex-basis: 14px;
        }
        .download {
          min-height: 50px;
          padding: 10px 7px;
          border-radius: 13px;
          font-size: 0.75rem;
        }
        .download svg {
          width: 14px;
          height: 14px;
          flex-basis: 14px;
        }
        .info-page {
          margin-top: 24px;
          padding: 28px 20px;
          border-radius: 22px;
        }
        .info-copy {
          font-size: 14px;
          line-height: 1.65;
        }
      }
      @media (max-width: 380px) {
        .container,
        .info-page {
          width: calc(100% - 24px);
        }
        .nav-button {
          font-size: 11px;
        }
        .card {
          grid-template-columns: 72px minmax(0, 1fr) minmax(86px, 91px);
          gap: 8px;
          padding-right: 8px;
        }
        .image-wrap {
          width: 72px;
          height: 72px;
        }
        .download {
          padding-inline: 5px;
          font-size: 0.7rem;
        }
      }
    </style>

      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],

      function renderHome() {
        document.getElementById("content").innerHTML =
          '<section class="container cards-section"><div class="cards" id="cards"></div></section>';
        const cards = document.getElementById("cards");
        apps.forEach(([name, image, download], index) => {
          const card = document.createElement("article");
          card.className = "card";
          card.style.animationDelay = `${Math.min(index * 18, 420)}ms`;
          card.innerHTML = `
          <span class="number">#${String(index + 1).padStart(2, "0")}</span>
          <div class="image-wrap"><img src="${escapeHtml(image)}" alt="${escapeHtml(name)} app preview" loading="${index < 8 ? "eager" : "lazy"}"></div>

            <div class="meta">
              <div class="meta-line bonus">${giftIcon}<span>Sign Up Bonus</span></div>

          </div>
          <a class="download" href="${escapeHtml(download)}" target="_blank" rel="noopener noreferrer">${downloadIcon}<span>Download</span></a>
        `;

        });

      function renderInfo(page) {
        const content = pages[page];
        document.getElementById("content").innerHTML = `
        <section class="info-page">
          <p class="eyebrow">${escapeHtml(content.eyebrow)}</p>
          <h1 class="info-title">${escapeHtml(content.title)}</h1>
          <p class="info-copy">${escapeHtml(content.copy)}</p>
          <div class="info-tags">${content.tags.map((tag) => `<span class="info-tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </section>
      `;
      }

      function setPage(page) {
        document.querySelectorAll(".nav-button").forEach((button) => {
          button.classList.toggle("active", button.dataset.page === page);
        });
        if (page === "home") renderHome();
        else renderInfo(page);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.querySelectorAll(".nav-button").forEach((button) => {
        button.addEventListener("click", body() => setPage(button.dataset.page));
